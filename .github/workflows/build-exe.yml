name: Build Trickster.exe

# Runs on Windows in GitHub's cloud, builds Trickster.exe and publishes it
# under "Releases" (tag: latest). Runs on every push to main, or press
# "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp build number
        shell: bash
        run: echo "${{ github.run_number }}" > version.txt

      - name: Build Trickster.exe
        shell: cmd
        run: build_exe.bat

      - name: Check the exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Trickster.exe)) { throw "dist/Trickster.exe was not produced" }
          Get-Item dist/Trickster.exe | Select-Object Name, Length

      - name: Build installer (TricksterSetup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:TRICKSTER_VERSION = (Get-Date -Format "yyyy.MM.dd")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path dist/TricksterSetup.exe)) { throw "dist/TricksterSetup.exe was not produced" }
          Get-Item dist/TricksterSetup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Trickster
          path: |
            dist/TricksterSetup.exe
            dist/Trickster.exe

      - name: Publish to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh release delete latest --yes --cleanup-tag || echo "no old release to delete"
          gh release create latest dist/TricksterSetup.exe dist/Trickster.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Trickster - Antidetect application" \
            --notes "Build ${{ github.run_number }}. Download TricksterSetup.exe and double-click it to install (uninstall from Settings > Apps). Trickster.exe is the portable version. Built automatically from commit ${{ github.sha }}."
          gh release view latest --repo "${{ github.repository }}"

  # ---- Tests on a real Windows machine (they report; they never block the download) ----
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Real browser test (own Chromium, sandbox, taskbar icon)
        shell: pwsh
        run: |
          python tests/windows_smoke.py *>&1 | Tee-Object -FilePath smoke.txt
          $lines = Get-Content smoke.txt | Select-Object -Last 45
          $msg = ($lines -join "%0A")
          Write-Host "::notice title=windows smoke results::$msg"
          if (Select-String -Path smoke.txt -Pattern "\[FAIL\]|Traceback" -Quiet) { Write-Host "::error title=windows smoke FAILED::$msg"; exit 1 }

  verify:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Trickster
          path: dl
      - name: Install silently, check app starts, then uninstall and check the folder is gone
        shell: pwsh
        run: |
          $out = @()
          function Say($m) { $script:out += $m; Write-Host $m }
          $failed = $false
          try {
            $dir = "$env:LOCALAPPDATA\Programs\Trickster"
            Start-Process -FilePath "dl\TricksterSetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
            if (Test-Path "$dir\Trickster.exe") { Say "PASS installed to $dir" } else { Say "FAIL Trickster.exe not installed"; $failed = $true }
            $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "Trickster*" }
            if ($key) { Say "PASS listed in Settings > Apps" } else { Say "FAIL not listed in Settings > Apps"; $failed = $true }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $log = "$dir\trickster.log"
            $ready = $false
            while ($sw.Elapsed.TotalSeconds -lt 240) {
              Start-Sleep -Seconds 5
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Browser engine ready|Chromium .* ready|already installed" -Quiet)) { $ready = $true; break }
            }
            if (Get-Process Trickster -ErrorAction SilentlyContinue) { Say "PASS Trickster is running (reopened itself)" } else { Say "FAIL Trickster is not running"; $failed = $true }
            if ($ready) { Say ("PASS browser engine ready after {0:n0}s" -f $sw.Elapsed.TotalSeconds) } else { Say "FAIL browser engine not ready after 240s"; $failed = $true }
            if (Test-Path $log) { Say "--- log tail ---"; Get-Content $log -Tail 25 | ForEach-Object { Say $_ } }
            Get-Process Trickster -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
            if (Test-Path "$dir\unins000.exe") {
              Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
              Start-Sleep -Seconds 5
            }
            if (Test-Path $dir) { Say "FAIL folder still there after uninstall"; $failed = $true } else { Say "PASS uninstall removed the whole folder" }
          } catch { Say "FAIL error: $_"; $failed = $true }
          $msg = ($out -join "%0A")
          if ($failed) { Write-Host "::error title=install check FAILED::$msg"; exit 1 } else { Write-Host "::notice title=install check::$msg" }
