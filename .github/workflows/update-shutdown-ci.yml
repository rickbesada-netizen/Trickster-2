name: Safe updater shutdown checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/updater-waits-for-process-exit]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check update code syntax
        run: python -m py_compile updater.py gui/app.py
      - name: Check PowerShell helper syntax
        shell: pwsh
        run: |
          python -c "import updater; from pathlib import Path; Path('test-update.ps1').write_text(updater.update_helper_script(), encoding='utf-8-sig')"
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path test-update.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Host; throw "PowerShell update helper invalid" }
      - name: Check shutdown sequencing
        run: python -m unittest discover -s tests -p "test_update_shutdown.py" -v
      - name: Test visible update checks
        run: python -m unittest discover -s tests -p "test_visible_updates.py" -v
