<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blocked</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0A0A12; color: #EDEDF2;
    font-family: -apple-system, Segoe UI, Roboto, system-ui, sans-serif;
  }
  .card { text-align: center; max-width: 460px; padding: 32px; }
  .lock { font-size: 56px; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { color: #9A9AAE; line-height: 1.5; }
  .host { color: #6E8BFF; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">&#128274;</div>
    <h1>This site is blocked</h1>
    <p><span class="host" id="host"></span> isn't on your allowed list.</p>
    <p>Only the websites you've allowed in AppBlocker can be opened while the web filter is on.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
