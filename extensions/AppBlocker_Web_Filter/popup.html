<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body { width: 280px; margin: 0; font-family: system-ui, Segoe UI, Arial, sans-serif;
    background: #0d0d14; color: #e8e8f0; }
  .top { padding: 14px 16px 10px; border-bottom: 1px solid #22222e; }
  .brand { font-weight: 700; font-size: 15px; }
  .state { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .body { padding: 12px 16px 14px; }
  .row { display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 6px 0; border-bottom: 1px solid #191922; }
  .row:last-child { border-bottom: none; }
  .row .k { color: #9a9ab0; }
  .row .v { font-weight: 600; }
  .v.on { color: #36c17a; }
  .v.off { color: #8a8a9a; }
  .note { font-size: 11.5px; color: #8a8a9a; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">AppBlocker Web Filter</div>
    <div class="state"><span id="dot" class="dot" style="background:#8a8a9a"></span>
      <span id="stateText">Checking…</span></div>
  </div>
  <div class="body">
    <div class="row"><span class="k">Browser</span><span id="browser" class="v">—</span></div>
    <div class="row"><span class="k">Blocked sites</span><span id="blocked" class="v">—</span></div>
    <div class="row"><span class="k">Allow-list only</span><span id="weblist" class="v">—</span></div>
    <div class="row"><span class="k">Adult filter</span><span id="adult" class="v">—</span></div>
    <p id="note" class="note"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
